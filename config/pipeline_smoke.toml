# Smoke-test configuration: the full pipeline with few folds and a small GP, written to results/model_smoke/.
# Identical to pipeline.toml except where noted.

[output]
model_dir = "model_smoke"

[qc]
night_sza_min = 100.0
vza_max = 60.0
overpass_gap_min = 20.0

[grid]
res_deg = 1

[era5]
night_sza_min = 100.0
smoothing_radii_km = [0.0, 300.0, 600.0, 1000.0, 1500.0]

[time]
origin = "2020-01-01"
first_month = "2020-01"
last_month = "2026-09"
gap_start = "2021-09"
gap_end = "2022-05"

[gp]
kernels = ["exponential", "gaussian", "matern32"]
n_inducing = 100          # smoke: small
restarts = 1              # smoke
max_iter = 10             # smoke
seed = 20261022
jitter = 1e-6
threads = 3
chunk_size = 20000
init_sigma_A = 15.0
init_sigma_B = 15.0
init_ell_space_A_km = 2000.0
init_ell_season_days = 60.0
init_ell_space_B_km = 4000.0
init_ell_time_years = 1.0
init_sigma0 = 15.0
init_sigma1 = 30.0

[cv]
spatial_block_lat = 90.0     # smoke: 2 x 3 blocks
spatial_block_lon = 120.0
spatial_buffer_km = 1000.0
temporal_window_months = 30  # smoke: 3 windows
temporal_buffer_months = 1
joint_block_lat = 90.0
joint_block_lon = 120.0
joint_window_months = 30
joint_buffer_km = 1000.0
joint_buffer_months = 1
joint_n_folds = 2
bootstrap_samples = 200

[baselines]
# Baselines scored on the same CV folds as the kernels (src/baselines.py; run_cv.py --model, --group baselines).
# The regression-only models (linear, linear_noera5) always run. The GP without ERA5 uses the winning kernel:
# set this to the first row of results/model/kernel_comparison.csv once the kernel CV has finished.
gp_noera5_kernels = ["matern32"]  # smoke: exercise the GP-without-ERA5 path

[maps]
min_months_per_year = 6
min_cells_per_month = 100
